# Run from the repo root on the server:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Secrets live in /opt/kizashi/.env on the host (never in the repo); see deploy/.env.example.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    # Set KIZASHI_IMAGE to pull a prebuilt image instead of building on the host.
    image: ${KIZASHI_IMAGE:-kizashi-api:local}
    env_file: /opt/kizashi/.env
    environment:
      PORT: "8787"
      NODE_ENV: production
    # Loopback only: reachable through Nginx, never straight from the internet.
    ports:
      - "127.0.0.1:4000:8787"
    networks: [kizashi]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  kizashi:
    driver: bridge
